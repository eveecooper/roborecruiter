name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The three assertions that are not negotiable. Run them on their own so a failure here is
      # unmistakable in the log rather than buried among ordinary test output.
      #   1. No submit-capable code path    docs/adr/0010
      #   2. No network code in stages 1-2  docs/adr/0005
      #   3. Posting text is never executed docs/planning/10-build-plan.md
      - name: Safety assertions
        run: uv run pytest tests/test_safety.py -v

      - name: Tests
        run: uv run pytest
