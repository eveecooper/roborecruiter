[project]
name = "roborecruiter"
version = "0.1.0"
description = "An assisted job application pipeline. Prepares materials; a person submits."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyyaml>=6.0",
]

[project.scripts]
rr = "rr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rr"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
# basic, not strict - see docs/agent/coding-standards.md. Matches what VS Code's Pylance runs,
# so the editor and CI agree.
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
